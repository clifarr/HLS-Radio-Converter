name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # The floor version, deliberately. `_toml` picks tomllib or the tomli
          # fallback by `sys.version_info`, and the `ty: ignore` comments exist
          # for a ty mis-resolution seen on 3.9 - so type-checking anywhere else
          # reports imports and suppressions that are not valid there.
          python-version: "3.9"
      - name: Install
        # --locked fails if uv.lock is out of date with pyproject.toml, which
        # catches a contributor who changed dependencies but forgot to commit
        # the regenerated lockfile.
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run ty check

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor: Raspberry Pi OS Bullseye ships it, and it is the
        # version that catches PEP 604 annotation mistakes at runtime.
        python: ["3.9", "3.11", "3.12", "3.13"]
    env:
      # Use the distro's ffmpeg, the same way the installer does on a Pi.
      #
      # Without this the code falls back to imageio-ffmpeg's bundled wheel, and
      # that build must not be what CI trusts: its x86_64 release (7.0.2) crashes
      # with SIGSEGV on *any* MPEG-TS input, so every transcoding test fails with
      # "ffmpeg closed its input" and no diagnostic at all. Pointing the tests at
      # a real binary also means they exercise the path a user actually gets.
      RADIOCONV_FFMPEG_PATH: /usr/bin/ffmpeg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # `python-version` is what selects the interpreter. It is not accepted
          # by setup-uv@v3, and the input being silently ignored there made all
          # four matrix entries run on the runner's default Python - the matrix
          # looked like it covered four versions and covered one.
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        # Every network call is bounded. Plain `apt-get update && apt-get
        # install` can wait forever on a stalled mirror or on the dpkg lock that
        # the runner's unattended-upgrades service holds, and an unbounded step
        # wedges the whole job: runs 39802019682 and 39804942257 were both
        # killed that way, in both cases *only* the matrix entries that were
        # still on this step (3.9/3.11/3.13 and 3.9/3.13 respectively) - the
        # ones that had got past it all passed. `timeout-minutes` turns a stall
        # into a red step in 10 minutes instead of a 20-minute hang, so the
        # answer is "re-run the job" rather than "the release cannot be
        # verified".
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Stop the service that grabs the dpkg lock on these images. `|| true`
          # because it is absent on some runner revisions.
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            ffmpeg
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
      - name: Self-test (generates and streams real HLS)
        run: uv run radioconv check --end-to-end --skip-port

  shell:
    name: shell (installer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n packaging/install.sh
      - name: Helper unit tests
        # The IP/port/station-detection helpers are the parts that quietly
        # produce a wrong URL, so they get their own tests rather than being
        # exercised only by a full install.
        run: bash scripts/test-installer-helpers.sh

  package:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Nothing is published anywhere. This job exists because `pip install .` is
      # how the Raspberry Pi installer works, so a tree that cannot build is a
      # broken install - and because a missing templates/ or static/ in the wheel
      # produces a service that starts, streams audio, and 500s on its own pages.
      - name: Build the wheel
        run: uv build
      - name: Check the packaged assets made it in
        # The same script the pre-commit hook runs, so the two cannot drift
        # apart. It builds the wheel again (cheap) and looks inside it.
        run: uv run python scripts/verify-wheel-assets.py
