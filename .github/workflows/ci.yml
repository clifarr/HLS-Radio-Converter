name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # The floor version, deliberately. `_toml` picks tomllib or the tomli
          # fallback by `sys.version_info`, and the `ty: ignore` comments exist
          # for a ty mis-resolution seen on 3.9 - so type-checking anywhere else
          # reports imports and suppressions that are not valid there.
          python-version: "3.9"
      - name: Install
        # --locked fails if uv.lock is out of date with pyproject.toml, which
        # catches a contributor who changed dependencies but forgot to commit
        # the regenerated lockfile.
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run ty check

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor: Raspberry Pi OS Bullseye ships it, and it is the
        # version that catches PEP 604 annotation mistakes at runtime.
        python: ["3.9", "3.11", "3.12", "3.13"]
    env:
      # Use the distro's ffmpeg, the same way the installer does on a Pi.
      #
      # Without this the code falls back to imageio-ffmpeg's bundled wheel, and
      # that build must not be what CI trusts: its x86_64 release (7.0.2) crashes
      # with SIGSEGV on *any* MPEG-TS input, so every transcoding test fails with
      # "ffmpeg closed its input" and no diagnostic at all. Pointing the tests at
      # a real binary also means they exercise the path a user actually gets.
      RADIOCONV_FFMPEG_PATH: /usr/bin/ffmpeg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # `python-version` is what selects the interpreter. It is not accepted
          # by setup-uv@v3, and the input being silently ignored there made all
          # four matrix entries run on the runner's default Python - the matrix
          # looked like it covered four versions and covered one.
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        # The runner image points apt at azure.archive.ubuntu.com. That mirror
        # stalled mid-transfer three times in a row: run 39808595539 fetched 8
        # of the 87 archives and then sat on libcodec2-1.2 (9 MB) for the rest
        # of the step with no bytes arriving at all, and runs 39802019682 and
        # 39804942257 were cancelled the same way. Every job that got past this
        # step passed, so none of it was ever about the code.
        #
        # Two things are needed, because there are two different failures:
        #
        #   1. A stalled transfer. `Acquire::http::Timeout` does NOT help - apt
        #      retries the same stuck connection - so each attempt is bounded
        #      with `timeout --signal=INT` (SIGINT, so apt releases the dpkg
        #      lock) and retried. apt keeps fetched archives in
        #      /var/cache/apt/archives, so a retry resumes instead of starting
        #      over and the remaining set shrinks.
        #   2. A bad mirror, where every attempt stalls. So the attempts rotate
        #      through different Ubuntu mirrors, repointing the sources first.
        #      The image's own mirror is tried first (it is the fastest when it
        #      works), then the Ubuntu archive, then kernel.org's mirror.
        #
        # The cap is sized above the loop's own budget - 6 attempts x (180 s
        # update + 180 s install) is 36 minutes - because a cap that bites first
        # turns "the retries were unlucky" into the same red build as "nothing
        # was retried", which is the failure this step exists to avoid.
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true

          # Repoint every Ubuntu apt source at mirror $1, leaving non-Ubuntu
          # sources (packages.microsoft.com) alone. The hosts are matched, not
          # the whole URI, so the suite paths survive and any of our own
          # previous changes can be overwritten again on the next attempt.
          #
          # /etc/apt/apt-mirrors.txt is the one that actually matters on current
          # runners, and it is why this loop used to rotate nothing: the 24.04
          # image points ubuntu.sources at `mirror+file:/etc/apt/apt-mirrors.txt`,
          # so the host lives in that file and neither sources.list nor
          # /etc/apt/sources.list.d/*.sources contains it. Run 40370775712 showed
          # the result - six attempts, and every single `Get:` line still saying
          # azure.archive.ubuntu.com, so three "different" mirrors were the same
          # host six times. The sed is silent when a file is absent (`2>/dev/null
          # || true`), so this stays correct on an image that has no mirrorlist.
          repoint() {
            sudo sed -i -E \
              "s#(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com|mirrors\.edge\.kernel\.org)#$1#g" \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
              /etc/apt/apt-mirrors.txt 2>/dev/null || true
          }

          opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          # Empty string = the image's default mirror, i.e. leave the sources be.
          mirrors=("" "archive.ubuntu.com" "mirrors.edge.kernel.org")
          attempt=0
          for round in 1 2; do
            for mirror in "${mirrors[@]}"; do
              attempt=$((attempt + 1))
              label="${mirror:-the image default mirror}"
              echo "::group::ffmpeg, attempt $attempt via $label"
              if [ -n "$mirror" ]; then repoint "$mirror"; fi
              # Both calls are bounded: `update` can hang on a mirror that
              # accepts the connection and then says nothing, which is exactly
              # what azure.archive.ubuntu.com did.
              if sudo timeout --signal=INT 180 apt-get update "${opts[@]}" \
                 && sudo timeout --signal=INT 180 \
                      apt-get install -y --no-install-recommends "${opts[@]}" ffmpeg; then
                echo "::endgroup::"
                ffmpeg -version | head -1
                exit 0
              fi
              echo "::endgroup::"
              echo "::warning::ffmpeg install failed on attempt $attempt via $label; trying another mirror"
            done
          done
          echo "::error::could not install ffmpeg after $attempt attempts across 3 mirrors"
          exit 1
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
      - name: Self-test (generates and streams real HLS)
        run: uv run radioconv check --end-to-end --skip-port

  shell:
    name: shell (installer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n packaging/install.sh
      - name: Helper unit tests
        # The IP/port/station-detection helpers are the parts that quietly
        # produce a wrong URL, so they get their own tests rather than being
        # exercised only by a full install.
        run: bash scripts/test-installer-helpers.sh

  package:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Nothing is published anywhere. This job exists because `pip install .` is
      # how the Raspberry Pi installer works, so a tree that cannot build is a
      # broken install - and because a missing templates/ or static/ in the wheel
      # produces a service that starts, streams audio, and 500s on its own pages.
      - name: Build the wheel
        run: uv build
      - name: Check the packaged assets made it in
        # The same script the pre-commit hook runs, so the two cannot drift
        # apart. It builds the wheel again (cheap) and looks inside it.
        run: uv run python scripts/verify-wheel-assets.py
